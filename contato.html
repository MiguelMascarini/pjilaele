<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pé na Areia</title>
  <link rel="stylesheet" href="contato.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <header class="fade-in">
    <img src="https://github.com/MiguelMascarini/Laele-PJI/blob/main/static/css/ekosque.png?raw=true" alt="logo" class="logo">
  </header>

  <nav class="fade-in">
    <button class="nav-btn">Início</button>
    <button class="nav-btn">Ranks</button>
    <button class="nav-btn">Histórico</button>
    <a href="index.html">
      <button class="nav-btn">Meus Dados</button>
    </a>
    <div id="divBusca">
      <input type="text" id="txtBusca" placeholder="Buscar...">
      <button id="btnBusca"><i class="fas fa-search"></i></button>
    </div>
  </nav>



<form class="form-contato" id="contatoForm">
  <label for="nome">Nome:</label>
  <input type="text" id="nome" name="nome" required>
  
  <label for="email">E-mail:</label>
  <input type="email" id="email" name="email" required>
  
  <label for="mensagem">Mensagem:</label>
  <textarea id="mensagem" name="mensagem" required></textarea>
  
  <button type="submit">Enviar</button>
</form>

<script>
document.getElementById('contatoForm').addEventListener('submit', function(e){
  e.preventDefault();
  const dados = {
    nome: document.getElementById('nome').value,
    email: document.getElementById('email').value,
    mensagem: document.getElementById('mensagem').value
  };

  fetch('http://localhost:3001/enviar-contato', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(dados)
  })
  .then(res => res.json())
  .then(res => {
    alert(res.msg);
    if (res.ok) document.getElementById('contatoForm').reset();
  })
  .catch(() => alert('Falha ao enviar.'));
});
</script>

</body>

</html>
